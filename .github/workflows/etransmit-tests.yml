name: e-transmit tests

on:
  push:
    branches: [main]
    paths:
      - 'lib/easybim_etransmit/**'
      - 'EasyBIM.tab/Links.panel/**'
      - 'Development Space/tests/etransmit/**'
      - '.github/workflows/etransmit-tests.yml'
  pull_request:
    paths:
      - 'lib/easybim_etransmit/**'
      - 'EasyBIM.tab/Links.panel/**'
      - 'Development Space/tests/etransmit/**'
      - '.github/workflows/etransmit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-tests:
    name: Filesystem and API-shaped tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run e-transmit tests (not a Revit integration test)
        run: python -m unittest discover -s "Development Space/tests/etransmit" -v
      - name: Archive the tested e-transmit sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etransmit-verified-source-${{ matrix.os }}
          retention-days: 7
          path: |
            lib/easybim_etransmit/
            EasyBIM.tab/Links.panel/
            Development Space/tests/etransmit/
            !**/__pycache__/**
          if-no-files-found: error
