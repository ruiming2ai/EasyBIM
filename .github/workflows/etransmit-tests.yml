name: e-transmit tests

on:
  push:
    branches: [main]
    paths:
      - 'lib/easybim_etransmit/**'
      - 'EasyBIM.tab/Links.panel/**'
      - 'Development Space/tests/etransmit/**'
      - '.github/workflows/etransmit-tests.yml'
  pull_request:
    paths:
      - 'lib/easybim_etransmit/**'
      - 'EasyBIM.tab/Links.panel/**'
      - 'Development Space/tests/etransmit/**'
      - '.github/workflows/etransmit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-tests:
    name: Filesystem and API-shaped tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run e-transmit tests (not a Revit integration test)
        run: python -m unittest discover -s "Development Space/tests/etransmit" -v
      - name: Archive the tested e-transmit sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etransmit-verified-source-${{ matrix.os }}
          retention-days: 7
          path: |
            lib/easybim_etransmit/
            EasyBIM.tab/Links.panel/
            Development Space/tests/etransmit/
            !**/__pycache__/**
          if-no-files-found: error

  ironpython-copy-tests:
    name: Real IronPython 2.7 local copy (Windows, no Revit)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download pinned official IronPython runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'IronPython.2.7.12.zip'
          $folder = Join-Path $env:RUNNER_TEMP 'IronPython-2.7.12'
          Invoke-WebRequest 'https://github.com/IronLanguages/ironpython2/releases/download/ipy-2.7.12/IronPython.2.7.12.zip' -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $folder
          $ipy = Get-ChildItem -LiteralPath $folder -Recurse -Filter ipy.exe | Where-Object { $_.FullName -match 'net45' } | Select-Object -First 1
          if (-not $ipy) { $ipy = Get-ChildItem -LiteralPath $folder -Recurse -Filter ipy.exe | Select-Object -First 1 }
          if (-not $ipy) { throw 'Official archive did not contain ipy.exe' }
          "IPY_EXE=$($ipy.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run unchanged copy code under IronPython (not a Revit test)
        shell: pwsh
        run: |
          & $env:IPY_EXE 'Development Space/tests/etransmit/test_runtime_copy.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:IPY_EXE 'Development Space/tests/etransmit/test_runtime_progress.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:IPY_EXE 'Development Space/tests/etransmit/test_source_automation.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
