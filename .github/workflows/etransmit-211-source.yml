name: e-transmit 2.1.1 source delivery (temporary)
on:
  push:
    branches: [fix/etransmit-current-host-211]
    paths: [.github/workflows/etransmit-211-source.yml]
permissions:
  contents: write
jobs:
  apply-tested-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/etransmit-current-host-211
      - name: Verify and apply the locally tested host-preservation patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          shas = ['52dee96b8aeffc130ed106482ec3ea448a347c7a', 'a4858fcfec39664a923e53a5d49041de08c5807c', 'a281b933f4c4738ab7866b86f107d235ed1901c9', 'eadf75a4672f415a87180b478128fbc0e4031e46', 'ad77654617200c3950ec011ad41cc5c41c4b7fd7']
          parts = []
          for sha in shas:
              req = urllib.request.Request('https://api.github.com/repos/ruiming2ai/EasyBIM/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.load(response)
              part = base64.b64decode(data['content'])
              assert hashlib.sha1(b'blob ' + str(len(part)).encode() + b'\0' + part).hexdigest() == sha
              parts.append(part)
          compressed = base64.b64decode(b''.join(parts), validate=True)
          assert hashlib.sha256(compressed).hexdigest() == '57e7a62d288a065ab19e44dba218caac972c59085755d5367ede99da1dbc8111'
          patch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'etransmit-211.patch'
          patch.write_bytes(lzma.decompress(compressed))
          stats = subprocess.check_output(['git', 'apply', '--numstat', str(patch)], text=True)
          paths = [line.split('\t', 2)[2] for line in stats.splitlines()]
          prefixes = ('lib/easybim_etransmit/', 'Development Space/tests/etransmit/', 'Development Space/docs/', 'EasyBIM.tab/Links.panel/e-transmit.pushbutton/')
          assert len(paths) == 14 and len(set(paths)) == 14
          for name in paths:
              assert name.startswith(prefixes) and pathlib.PurePosixPath(name).suffix in ('.py', '.md', '.yaml', '.xaml')
              assert '..' not in pathlib.PurePosixPath(name).parts and not pathlib.PurePosixPath(name).is_absolute()
          subprocess.check_call(['git', 'apply', '--check', str(patch)])
          subprocess.check_call(['git', 'apply', str(patch)])
          subprocess.check_call(['python', '-m', 'unittest', 'discover', '-s', 'Development Space/tests/etransmit', '-v'])
          workflow = pathlib.Path('.github/workflows/etransmit-tests.yml')
          text = workflow.read_text()
          assert text.count("-Filter 'test_210_*.py'") == 1
          workflow.write_text(text.replace("-Filter 'test_210_*.py'", "-Filter 'test_21*_*.py'"))
          subprocess.check_call(['git', 'add', '--'] + paths + [str(workflow)])
          subprocess.check_call(['git', 'config', 'user.name', 'github-actions[bot]'])
          subprocess.check_call(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'])
          subprocess.check_call(['git', 'commit', '-m', 'fix(etransmit): protect current open host snapshots and use model-named jobs in 2.1.1'])
          subprocess.check_call(['git', 'push', 'origin', 'HEAD:refs/heads/fix/etransmit-current-host-211'])
          print('Verified host-preservation repair and expanded IronPython regression coverage.')
          PY
