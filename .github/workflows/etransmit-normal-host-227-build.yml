name: Verify e-transmit 2.1.27 normal host delivery
on:
  push:
    branches: [codex/etransmit-normal-host-227-build]
permissions:
  contents: read
jobs:
  portable:
    name: Regressions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply checksum-verified repair to pinned main
        run: python .github/etransmit227_apply.py
      - name: Run e-transmit regressions (not a Revit integration test)
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s 'Development Space/tests/etransmit' -v 2>&1 | tee "$RUNNER_TEMP/etransmit-tests.log"
      - name: Run complete root suite
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s 'Development Space/tests' -v 2>&1 | tee "$RUNNER_TEMP/root-tests.log"
      - name: Archive verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etransmit227-${{ matrix.os }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/etransmit-tests.log
            ${{ runner.temp }}/root-tests.log
            ${{ runner.temp }}/etransmit227-source-hashes.json

  ironpython:
    name: Windows IronPython 2.7 (no Revit)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply checksum-verified repair to pinned main
        run: python .github/etransmit227_apply.py
      - name: Verify shipped native helper
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet build 'Development Space/native/EasyBIM.FileIO/EasyBIM.FileIO.csproj' -c Release -o "$env:RUNNER_TEMP/ETNative"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $built=(Get-FileHash "$env:RUNNER_TEMP/ETNative/EasyBIM.FileIO.dll" -Algorithm SHA256).Hash
          $shipped=(Get-FileHash 'lib/easybim_etransmit/native/EasyBIM.FileIO.dll' -Algorithm SHA256).Hash
          if ($built -ne $shipped) { throw 'Native helper does not match its source.' }
      - name: Get pinned official IronPython
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $env:RUNNER_TEMP 'IronPython.2.7.12.zip'
          $folder=Join-Path $env:RUNNER_TEMP 'IronPython-2.7.12'
          Invoke-WebRequest 'https://github.com/IronLanguages/ironpython2/releases/download/ipy-2.7.12/IronPython.2.7.12.zip' -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $folder
          $ipy=Get-ChildItem -LiteralPath $folder -Recurse -Filter ipy.exe | Where-Object { $_.FullName -match 'net45' } | Select-Object -First 1
          if (-not $ipy) { throw 'Official runtime has no net45 ipy.exe.' }
          "IPY_EXE=$($ipy.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run production copy and compatibility tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'ironpython-tests.log'
          $names=@('test_runtime_copy.py','test_runtime_progress.py','test_source_automation.py','test_payload_acquisition.py','test_runtime_longpaths.py','test_runtime_reference_repairs.py','test_209_regressions.py')
          $names += Get-ChildItem 'Development Space/tests/etransmit' -File | Where-Object { $_.Name -match '^test_2[12].*\.py$' } | Sort-Object Name | ForEach-Object { $_.Name }
          foreach ($name in $names) {
            "TEST $name" | Tee-Object -FilePath $log -Append
            & $env:IPY_EXE (Join-Path 'Development Space/tests/etransmit' $name) 2>&1 | Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Archive compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etransmit227-ironpython
          retention-days: 7
          path: |
            ${{ runner.temp }}/ironpython-tests.log
            ${{ runner.temp }}/etransmit227-source-hashes.json

  publish:
    name: Publish clean candidate after all checks
    needs: [portable, ironpython]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reapply exact tested repair
        run: python .github/etransmit227_apply.py
      - name: Publish candidate without temporary CI files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'EasyBIM repair'
          git config user.email '142599989+ruiming2ai@users.noreply.github.com'
          git commit -m 'Fix e-transmit 2.1.27 normal host delivery' -m 'Remove default metadata-only transmitted host delivery. Require normal saved output for successful repairs, retain verified original host on stopped-worker failure or missing references, preserve active-worker quarantine, and retain external Revit link inventory. Compared with the supplied 2.1.6 and 2.1.26 reports. Source models and Auto Update unchanged. Portable Linux/Windows and IronPython checks passed; native Revit acceptance remains required.'
          git push origin HEAD:refs/heads/codex/etransmit-normal-host-227
          git log -1 --format='%H %T' | tee "$RUNNER_TEMP/etransmit227-candidate.txt"
          git archive --format=zip --prefix=EasyBIM.extension/ HEAD -o "$RUNNER_TEMP/EasyBIM-2.1.27-full-source.zip"
      - name: Archive candidate identity and full source
        uses: actions/upload-artifact@v4
        with:
          name: etransmit227-candidate
          retention-days: 7
          path: |
            ${{ runner.temp }}/etransmit227-candidate.txt
            ${{ runner.temp }}/etransmit227-source-hashes.json
            ${{ runner.temp }}/EasyBIM-2.1.27-full-source.zip
