name: Auto Update review validation
on:
  push:
    branches: [codex/auto-update-review-20261004]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pack source and history
        run: tar -czf /tmp/easybim-review.tar.gz --exclude=.git/hooks .
      - uses: actions/upload-artifact@v4
        with:
          name: easybim-review-source
          path: /tmp/easybim-review.tar.gz
          retention-days: 3
