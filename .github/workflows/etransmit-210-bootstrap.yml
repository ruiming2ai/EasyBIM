name: e-transmit API signature repair (temporary)
on:
  push:
    branches: [feat/etransmit-live-acc-batch-210]
    paths: [.github/workflows/etransmit-210-bootstrap.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/etransmit-live-acc-batch-210
      - name: Apply the locally verified API signature correction
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          path = Path('lib/easybim_etransmit/session.py')
          text = path.read_text()
          old = 'value=doc.GetDocumentVersion()'
          assert text.count(old) == 1
          path.write_text(text.replace(old, 'value=doc.GetDocumentVersion(doc)  # Static Revit API requires the Document argument.'))
          test = Path('Development Space/tests/etransmit/test_210_session.py')
          text = test.read_text()
          for guid in ('guid', 'loaded'):
              old = "GetDocumentVersion=lambda:Obj(VersionGUID='" + guid + "'"
              new = "GetDocumentVersion=lambda document:Obj(VersionGUID='" + guid + "'"
              assert text.count(old) == 1
              text = text.replace(old, new)
          test.write_text(text)
          subprocess.check_call(['python', '-m', 'unittest', 'discover', '-s', 'Development Space/tests/etransmit', '-v'])
          subprocess.check_call(['git', 'add', '--', str(path), str(test)])
          subprocess.check_call(['git', 'config', 'user.name', 'github-actions[bot]'])
          subprocess.check_call(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'])
          subprocess.check_call(['git', 'commit', '-m', 'fix(etransmit): call the static Revit DocumentVersion API with its document argument'])
          subprocess.check_call(['git', 'push', 'origin', 'HEAD:refs/heads/feat/etransmit-live-acc-batch-210'])
          PY
