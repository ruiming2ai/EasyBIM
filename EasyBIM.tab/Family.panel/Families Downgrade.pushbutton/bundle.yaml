title: "Families\nDowngrade"
tooltip: >-
  Rebuild loadable families for an older Revit. Pick families from this
  project, opened .rfa files and Revit links, pick the Revit version you need
  from the ones installed on this machine, and pick a folder: that Revit is
  opened in the background, rebuilds the families and closes again, leaving
  .rfa files of that version. A downgrade is a rebuild, not a file conversion
  - no Revit can save a family for another release - so rebuilt solids are
  static, and everything a family loses is listed in the report written next
  to the files. Both halves are also available on their own for when the
  older Revit is on another computer.
author: Ruiming Liu
min_revit_version: 2021
context: zero-doc
