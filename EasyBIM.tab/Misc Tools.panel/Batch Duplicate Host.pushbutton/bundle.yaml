title: "Batch Duplicate\nHost"
tooltip: >-
  Place independent MEP and Generic Model copies using target-local offsets
  and orientation. Monitor linked instances (on by default), or copy each
  linked instance's original family type and instance values.
  Uncertified hosted families are reported without hosted substitutes.
  Other categories retain legacy copying; monitoring is unavailable for them.
author: Ruiming Liu
min_revit_version: 2024
max_revit_version: 2027
