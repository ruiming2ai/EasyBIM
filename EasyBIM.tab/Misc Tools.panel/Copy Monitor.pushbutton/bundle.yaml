title: "Copy\nMonitor"
tooltip: >-
  Copy independent MEP and Generic Model instances, monitor existing pairs,
  and review linked changes on command. Match source, keep relative location,
  accept differences, postpone, or stop monitoring in batches.
  Hosted conversion support requires certification; unsupported families are reported.
