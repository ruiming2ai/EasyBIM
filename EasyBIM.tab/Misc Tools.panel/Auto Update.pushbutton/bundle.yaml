title: "Auto\nUpdate"
context: zero-doc
tooltip: >-
  Check EasyBIM's configured upstream branch, install missing changes,
  and reload pyRevit if this Revit session has an older version loaded.

  Every click reports the result. A successful remote check is required
  to confirm that EasyBIM is up to date. Local changes are preserved.

  Only the EasyBIM repository is updated - other installed extensions
  are left alone. Use pyRevit's own Update button to refresh everything
  else.

  Also checks automatically at startup. Other open Revit sessions sharing
  this installation check every 10 seconds and request a safe Revit API
  cycle to reload changed files, even without mouse activity. Busy commands
  and dialogs defer the reload. Separate installation folders are independent.
  No separate Auto Update click is needed in each session after this updater
  has been loaded. Transient reload failures receive limited automatic retries.
author: Ruiming Liu
