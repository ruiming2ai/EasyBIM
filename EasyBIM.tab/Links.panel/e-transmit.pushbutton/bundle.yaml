title: e-transmit
tooltip: >-
  Transmit the verified locally saved/cache edition of open models and loaded
  links. Unsaved edits are excluded. No Save, SaveAs, Sync, Publish or relocation
  of working documents. Original caches are read only; copied models alone may
  be detached/repathed. Retains a checksum-verified _HostState baseline.
  Model-named job folders and individual ZIPs. Review the reports before delivery.
author: Ruiming Liu
context: zero-doc
min_revit_version: 2023
engine:
  clean: true
