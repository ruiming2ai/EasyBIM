title: e-transmit
tooltip: >-
  Transmit the verified locally saved/cache edition of open models and identified
  links. Unsaved edits are excluded unless detached-model recovery explicitly
  saves the current state. No Sync or Publish. Outside that explicit recovery,
  working documents are not relocated. Original caches are read only. Final host
  copies are saved as independent models with worksets preserved and open normally;
  Disable worksets is an optional cleanup choice. Batch preflight scans all selected hosts before processing. Only placed unloaded Revit links are offered for temporary reload; ACC/cloud links are preselected during detached file-location recovery so their saved cache can be acquired.
  One Links folder per host package: categories, original folders, or all files together.
  Same-name files use separate subfolders. Model-named job folders and individual ZIPs. Review the reports before delivery.
author: Ruiming Liu
context: zero-doc
min_revit_version: 2023
engine:
  clean: true
