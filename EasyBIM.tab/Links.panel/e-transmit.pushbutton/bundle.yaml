title: e-transmit
tooltip: >-
  Save checked open models in their current state before collecting materials.
  Preserve an unchanged, checksummed HostSnapshot; name each job and ZIP after
  its Revit model. No published-host fallback. One upfront SaveAs confirmation
  explains the working-path change. ACC link downloads can be skipped without
  deleting their references. Saved-file and optional cloud workflows remain.
author: Ruiming Liu
