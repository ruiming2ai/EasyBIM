title: e-transmit
tooltip: >-
  Transmit current open documents, saved files, or explicitly selected published
  ACC versions. Preserve filenames and source hierarchy where exposed. Includes
  batch jobs, separate per-model ZIPs, readable plugin spreadsheet sources,
  optional read-only Autodesk sign-in, and explicit current-state SaveAs consent.
  Missing revisions and unsupported repathing are reported, never substituted.
