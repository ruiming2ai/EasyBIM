title: "My\nRibbon"
tooltip: |-
  Pick buttons from other pyRevit extensions and put them on panels of your own.
  Choose from the extensions and ribbon tabs already on this computer, or turn a Dynamo graph into a button; then tick the buttons you want and say where they go - an EasyBIM panel, a new panel, or a tab of your own.
  Sources stay ordinary installed extensions, so pyRevit's Update button keeps them fresh. Settings can be exported and imported.
author: Ruiming Liu
context: zero-doc
